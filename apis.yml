name: Virtusa
description: 'Virtusa Corporation is a global provider of digital engineering, IT consulting, and
  outsourcing services headquartered in Southborough, Massachusetts. Founded in 1996, the company
  helps enterprises across banking and financial services, insurance, healthcare, communications,
  media, and manufacturing modernize their technology through cloud, data, AI, and application
  engineering. Formerly publicly traded on NASDAQ (VRTU), Virtusa was acquired by Baring Private
  Equity Asia in 2021 and employs tens of thousands of engineers worldwide. Virtusa operates as a
  professional-services and delivery organization; it does not publish a public developer portal or
  external API program, so this API Evangelist profile captures its corporate and domain-security
  footprint rather than a consumable API surface.'
